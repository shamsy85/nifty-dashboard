name: Post-Market Nifty Report Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5' # Runs automatically at 6:00 PM IST (12:30 UTC) Monday-Friday

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance

      - name: Fetch Live Data
        run: |
          python fetch_data.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Automated Live Data Update" || exit 0
          git push
