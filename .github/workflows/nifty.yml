name: Update Nifty Dashboard Data

on:
  schedule:
    - cron: '30 11 * * *'  # Runs daily at 5:00 PM IST (11:30 UTC)
    - cron: '30 12 * * *'  # Runs daily at 6:00 PM IST (12:30 UTC)
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests fyers-apiv3 pyotp

    - name: Run market data script
      env:
        FYERS_CLIENT_ID: "SKZODRJWMB-200"
        FYERS_SECRET_KEY: "Qu61IAGCiTVURBjz"
        FYERS_PIN: "1997"
        FYERS_TOTP_KEY: "WRUOITZF6ROJOTIQVDQCE3ZLLGIMIRMH"
      run: |
        python main.py

    - name: Commit and push changes if data.json updated
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Nifty dashboard data [skip ci]" && git push)
