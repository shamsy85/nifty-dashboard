name: Run FYERS Data Fetch

on:
  schedule:
    - cron: '30 11 * * *' # Runs daily at 5:00 PM IST
    - cron: '30 12 * * *' # Runs daily at 6:00 PM IST
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
  
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests fyers-apiv3

    - name: Run data fetching script
      env:
        FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
      run: |
        python main.py

    - name: Commit and push updated data.json
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data.json
        git commit -m "Automated Post-Market Data Update [skip ci]" || echo "No changes to commit"
        git push
