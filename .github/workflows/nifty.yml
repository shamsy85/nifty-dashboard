name: Nifty Market Data Automation

on:
  schedule:
    - cron: '30 11 * * *'  # Runs daily at 5:00 PM IST (11:30 UTC)
    - cron: '30 12 * * *'  # Runs daily at 6:00 PM IST (12:30 UTC)
  workflow_dispatch:        # Allows manual trigger from Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fyers-apiv3 requests pyotp

      - name: Run market data script
        env:
          FYERS_CLIENT_ID: SKZODRJWMB-200
          FYERS_SECRET_KEY: Qu61IAGCiTVURBjz
          FYERS_PIN: 1997
          FYERS_TOTP_KEY: 2SGUPUQAPLCQ72R2SD7PV3SOB33ZKUXF
        run: python main.py

      - name: Commit and push changes if data.json updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Nifty data.json [skip ci]" && git push)
