name: Run FYERS Data Fetch

on:
  schedule:
    - cron: '30 3 * * *' # Runs daily at 9:00 AM IST (3:30 UTC)
  workflow_dispatch: # Allows you to run it manually from GitHub

jobs:
  fetch-data:
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests fyers-apiv3

    - name: Run data fetching script
      env:
        FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
      run: |
        python main.py
