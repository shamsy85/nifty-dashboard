name: Update NIFTY Data

on:
  schedule:
    - cron: '30 12 * * 1-5' # Runs Monday through Friday at 6:00 PM IST
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nsepython pandas

      - name: Run data fetch script
        run: python fetch_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --staged --quiet || (git commit -m "Automated NIFTY data update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && git push)
