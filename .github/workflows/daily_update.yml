name: Post-Market Nifty Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5' # Runs at 3:30 PM IST (10:00 UTC) Monday-Friday

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run post-market fetch script
        run: |
          python fetch_data.py

      - name: Commit and push daily report
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Post-market update: Daily Nifty HLC report generated" || exit 0
          git push
