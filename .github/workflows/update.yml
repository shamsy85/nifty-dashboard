name: Update Dashboard Data

on:
  schedule:
    # Runs every 30 minutes during Indian Market Hours (Mon-Fri)
    - cron: '*/30 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate Upstox Access Token
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NO: ${{ secrets.UPSTOX_MOBILE_NO }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_KEY: ${{ secrets.UPSTOX_TOTP_SECRET }}
        run: python get_token.py

      - name: Fetch Market Data and Update JSON
        run: python update.py
