name: Update Nifty Dashboard

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI
  schedule:
    - cron: '30 11 * * *' # Runs at 5:00 PM IST (11:30 UTC)
    - cron: '0 12 * * *'  # Runs at 5:30 PM IST (12:00 UTC)
    - cron: '30 12 * * *' # Runs at 6:00 PM IST (12:30 UTC)
    - cron: '0 13 * * *'  # Runs at 6:30 PM IST (13:00 UTC)
    - cron: '30 13 * * *' # Runs at 7:00 PM IST (13:30 UTC)

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests pyotp playwright yfinance
          playwright install chromium

      - name: Generate Fresh Access Token
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NO: ${{ secrets.UPSTOX_MOBILE_NO }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
        run: python get_token.py

      - name: Upload Debug Screenshot on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: error-screenshot
          path: error_debug.png

      - name: Run Market Update Script
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python update.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update Nifty dashboard data [skip ci]" || echo "No changes to commit"
          git push
