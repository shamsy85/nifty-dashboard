name: Update Nifty Dashboard Data

on:
  schedule:
    # 11:00 UTC = 4:30 PM IST (Monday - Friday)
    - cron: "30 11 * * 1-5"
    # 12:30 UTC = 6:00 PM IST (Monday - Friday)
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python update.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data.json ]; then
            git add data.json
            if git diff --cached --quiet; then
              echo "No changes detected in data.json"
            else
              git commit -m "Auto-update NIFTY dashboard data [skip ci]"
              git push
            fi
          else
            echo "Error: data.json was not generated during script execution."
            exit 1
          fi
