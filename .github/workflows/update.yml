name: Update Dashboard Data

on:
  schedule:
    # Runs every 30 minutes from 5:00 PM IST to 9:30 PM IST (11:30 UTC to 16:00 UTC) Mon-Fri
    - cron: '30 11 * * 1-5'
    - cron: '0,30 12-15 * * 1-5'
    - cron: '0 16 * * 1-5'

  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    # Optional: grant permissions so the action can push to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch Market Data and Update JSON
        run: python update.py update here
