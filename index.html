<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #ffffff; }
        .card { background: #2d2d2d; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        .flex { display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nifty Analytics Dashboard</h1>
        <div class="card">
            <h3>Market Overview</h3>
            <p>Date: <span id="currentDate">-</span> | Expiry: <span id="expiryDate">-</span></p>
            <div class="flex">
                <div>Spot Price: <strong id="spotPrice">0.00</strong></div>
                <div>ATM Strike: <strong id="atmStrike">0</strong></div>
            </div>
        </div>
        <div class="card">
            <h3>Sniper Setups</h3>
            <p>Sniper 1 Strike: <span id="sniper1-strike">0</span> (Val: <span id="sniper1-val">0.00</span>)</p>
            <p>Sniper 2 Strike: <span id="sniper2-strike">0</span> (Val: <span id="sniper2-val">0.00</span>)</p>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                let response = await fetch('data.json');
                let data = await response.json();

                document.getElementById('currentDate').innerText = data.currentDate;
                document.getElementById('expiryDate').innerText = data.expiryDate;
                document.getElementById('spotPrice').innerText = data.spotPrice;
                document.getElementById('atmStrike').innerText = data.atmStrike;
                document.getElementById('sniper1-strike').innerText = data.sniper1.strike;
                document.getElementById('sniper1-val').innerText = data.sniper1.val;
                document.getElementById('sniper2-strike').innerText = data.sniper2.strike;
                document.getElementById('sniper2-val').innerText = data.sniper2.val;
            } catch (error) {
                console.error('Error loading data.json:', error);
            }
        }
        loadData();
    </script>
</body>
</html>
