<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIFTY Dashboard</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .spot-price {
      font-size: 24px;
      color: var(--text-main);
    }

    .badge {
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .banner-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sub-badge {
      background-color: #1f2937;
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .atm-display {
      margin-top: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    .atm-label {
      color: var(--cyan);
      font-size: 14px;
      margin-right: 6px;
    }

    .banner-right {
      text-align: right;
    }

    .diff-value {
      color: var(--green);
      font-size: 28px;
      font-weight: bold;
    }

    .ce-pe-line {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .option-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      position: relative;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-tag {
      border: 1px solid var(--yellow);
      color: var(--yellow);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .strike-header {
      font-size: 22px;
      font-weight: bold;
    }

    .type-label {
      color: var(--cyan);
      font-weight: bold;
      font-size: 14px;
    }

    .card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
    }

    .candle-container {
      width: 12px;
      height: 90px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wick {
      position: absolute;
      width: 2px;
      height: 100%;
      background-color: var(--yellow);
    }

    .wick.pe-wick {
      background-color: var(--red);
    }

    .node {
      position: absolute;
      width: 10px;
      height: 4px;
      background-color: var(--yellow);
      z-index: 2;
    }

    .body-box {
      position: absolute;
      width: 10px;
      background-color: var(--red);
      z-index: 2;
    }

    .price-details {
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }

    .val-close {
      font-weight: bold;
      font-size: 16px;
    }

    .ce-color { color: var(--yellow); }
    .pe-color { color: var(--red); }

    .card-footer {
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .foot-val {
      color: var(--cyan);
    }

    .foot-val-red {
      color: var(--red);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div class="title-group">
        <div class="title">NIFTY</div>
        <div class="spot-price" id="spotPrice">--</div>
      </div>
      <div class="badge" id="expiryDate">EXP --</div>
    </div>

    <div class="banner-card">
      <div class="banner-left">
        <span class="sub-badge" id="currentDate">--</span>
        <div class="atm-display">
          <span class="atm-label">ATM</span><span id="atmStrike">--</span>
        </div>
      </div>
      <div class="banner-right">
        <div class="diff-value" id="bannerTotal">--</div>
        <div class="ce-pe-line">
          CE <span id="bannerCe">--</span> • PE <span id="bannerPe">--</span>
        </div>
      </div>
    </div>

    <div class="cards-grid">
      <!-- CE Card -->
      <div class="option-card">
        <div class="card-top">
          <span class="status-tag">NEUTRAL</span>
          <span class="type-label">CE</span>
        </div>
        <div class="strike-header" id="ceStrike">--</div>
        <div class="card-body">
          <div class="candle-container">
            <div class="wick"></div>
            <div class="node" style="top: 40%;"></div>
          </div>
          <div class="price-details">
            <div>H <span id="ceHigh">--</span></div>
            <div class="val-close ce-color">C <span id="ceClose">--</span></div>
            <div>L <span id="ceLow">--</span></div>
          </div>
        </div>
        <div class="card-footer">
          <div>H-C <span class="foot-val" id="ceHC">--</span></div>
          <div>C-L <span class="foot-val-red" id="ceCL">--</span></div>
        </div>
      </div>

      <!-- PE Card -->
      <div class="option-card">
        <div class="card-top">
          <span class="status-tag">NEUTRAL</span>
          <span class="type-label" style="color: var(--red);">PE</span>
        </div>
        <div class="strike-header" id="peStrike">--</div>
        <div class="card-body">
          <div class="candle-container">
            <div class="wick pe-wick"></div>
            <div class="body-box" style="top: 25%; height: 50%;"></div>
          </div>
          <div class="price-details">
            <div>H <span id="peHigh">--</span></div>
            <div class="val-close pe-color">C <span id="peClose">--</span></div>
            <div>L <span id="peLow">--</span></div>
          </div>
        </div>
        <div class="card-footer">
          <div>H-C <span class="foot-val" id="peHC">--</span></div>
          <div>C-L <span class="foot-val-red" id="peCL">--</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        const data = await response.json();

        // Header info
        document.getElementById('spotPrice').innerText = data.spotPrice.toLocaleString('en-IN', {minimumFractionDigits: 2});
        document.getElementById('expiryDate').innerText = 'EXP ' + data.expiryDate;
        document.getElementById('currentDate').innerText = data.currentDate;
        document.getElementById('atmStrike').innerText = data.atmStrike;

        // CE and PE Close Prices
        const ceClose = data.ce.close;
        const peClose = data.pe.close;

        // Top Banner Absolute Difference (|PE - CE|)
        const absoluteDiff = Math.abs(peClose - ceClose).toFixed(2);
        document.getElementById('bannerTotal').innerText = absoluteDiff;
        document.getElementById('bannerCe').innerText = ceClose.toFixed(2);
        document.getElementById('bannerPe').innerText = peClose.toFixed(2);

        // CE Details
        document.getElementById('ceStrike').innerText = data.atmStrike;
        document.getElementById('ceHigh').innerText = data.ce.high.toFixed(2);
        document.getElementById('ceClose').innerText = ceClose.toFixed(2);
        document.getElementById('ceLow').innerText = data.ce.low.toFixed(2);
        
        const ceHC = (data.ce.high - ceClose).toFixed(2);
        const ceCL = (ceClose - data.ce.low).toFixed(2);
        document.getElementById('ceHC').innerText = ceHC;
        document.getElementById('ceCL').innerText = ceCL;

        // PE Details
        document.getElementById('peStrike').innerText = data.atmStrike;
        document.getElementById('peHigh').innerText = data.pe.high.toFixed(2);
        document.getElementById('peClose').innerText = peClose.toFixed(2);
        document.getElementById('peLow').innerText = data.pe.low.toFixed(2);

        const peHC = (data.pe.high - peClose).toFixed(2);
        const peCL = (peClose - data.pe.low).toFixed(2);
        document.getElementById('peHC').innerText = peHC;
        document.getElementById('peCL').innerText = peCL;

      } catch (err) {
        console.error("Error loading dashboard data:", err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
