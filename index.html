<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY Options Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .date { font-size: 0.9rem; color: #94a3b8; }
        .status { color: #22c55e; font-weight: bold; font-size: 0.85rem; }
        .card {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .spot-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; }
        .spot-price { font-size: 2.2rem; font-weight: bold; color: #38bdf8; margin: 5px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .metric-box { background: #1e293b; padding: 10px; border-radius: 6px; }
        .label { font-size: 0.75rem; color: #94a3b8; }
        .value { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }
        .ce-color { color: #22c55e; }
        .pe-color { color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>NIFTY Dashboard</h2>
            <div id="currentDate" class="date">Loading...</div>
        </div>
        <div class="status" id="expiryDate">--</div>
    </div>

    <!-- Spot Metrics -->
    <div class="card">
        <div class="spot-title">NIFTY 50 Spot Price</div>
        <div class="spot-price" id="spotPrice">0.00</div>
        <div class="grid">
            <div class="metric-box">
                <div class="label">Day High</div>
                <div class="value" id="spotHigh">0.00</div>
            </div>
            <div class="metric-box">
                <div class="label">Day Low</div>
                <div class="value" id="spotLow">0.00</div>
            </div>
        </div>
    </div>

    <!-- ATM & Premium Banner -->
    <div class="card">
        <div class="grid">
            <div class="metric-box">
                <div class="label">ATM Strike</div>
                <div class="value" id="atmStrike">0</div>
            </div>
            <div class="metric-box">
                <div class="label">Combined Straddle Price</div>
                <div class="value" id="bannerTotal">0.00</div>
            </div>
        </div>
    </div>

    <!-- Calls / Puts -->
    <div class="card grid">
        <div class="metric-box">
            <div class="label">CE Close</div>
            <div class="value ce-color" id="ceClose">0.00</div>
        </div>
        <div class="metric-box">
            <div class="label">PE Close</div>
            <div class="value pe-color" id="peClose">0.00</div>
        </div>
    </div>
</div>

<script>
    async function loadDashboardData() {
        try {
            // Append dynamic timestamp to prevent browser & GitHub Pages caching
            const response = await fetch(`data.json?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error('Network error loading data');
            
            const data = await response.json();

            document.getElementById('currentDate').innerText = data.currentDate || '--';
            document.getElementById('expiryDate').innerText = data.expiryDate || 'ACTIVE';
            document.getElementById('spotPrice').innerText = data.spotPrice ? data.spotPrice.toLocaleString('en-IN') : '0.00';
            document.getElementById('spotHigh').innerText = data.spotHigh ? data.spotHigh.toLocaleString('en-IN') : '0.00';
            document.getElementById('spotLow').innerText = data.spotLow ? data.spotLow.toLocaleString('en-IN') : '0.00';
            document.getElementById('atmStrike').innerText = data.atmStrike || '0';
            document.getElementById('bannerTotal').innerText = data.bannerTotal || '0.00';
            document.getElementById('ceClose').innerText = data.ce ? data.ce.close : '0.00';
            document.getElementById('peClose').innerText = data.pe ? data.pe.close : '0.00';

        } catch (error) {
            console.error('Failed to update dashboard interface:', error);
        }
    }

    // Initial load
    loadDashboardData();

    // Auto refresh fetch every 60 seconds
    setInterval(loadDashboardData, 60000);
</script>

</body>
</html>
