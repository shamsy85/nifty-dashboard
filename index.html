<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nifty Dashboard</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: monospace; padding: 15px; margin: 0; }
        .container { max-width: 450px; margin: auto; display: flex; flex-direction: column; gap: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; color: #00f3ff; }
        .exp-btn { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
        .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        .val-green { color: #00ff66; font-weight: bold; }
        .val-red { color: #ff3333; font-weight: bold; }
        .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .zone-box { background: #0f172a; padding: 8px; border-radius: 6px; font-size: 11px; }
        .zone-title { color: #00f3ff; margin-bottom: 4px; text-align: center; }
        .zone-row { display: flex; justify-content: space-between; margin: 2px 0; color: #ff3333; }
        .zone-row span:last-child { color: #00ff66; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>NIFTY <span id="spotPrice">--</span></span>
            <button class="exp-btn">EXP --</button>
        </div>

        <div class="card">
            <div class="row">
                <span id="currentDate" style="border: 1px solid #00f3ff; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #00f3ff;">--</span>
                <span class="val-green" style="font-size: 18px;">0.00</span>
            </div>
            <div style="margin-top: 5px; font-size: 13px;">ATM <span id="atmStrike" class="val-green">0</span></div>
        </div>

        <div class="zones">
            <div class="zone-box">
                <div class="zone-title">WEEKLY ZONE</div>
                <div class="zone-row"><span>24200.90</span><span>23970.20</span></div>
                <div class="zone-row"><span>24330.40</span><span>23850.40</span></div>
            </div>
            <div class="zone-box">
                <div class="zone-title">MONTHLY ZONE</div>
                <div class="zone-row"><span>24480.40</span><span>23700.40</span></div>
                <div class="zone-row"><span>24730.40</span><span>23480.40</span></div>
            </div>
        </div>

        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <span>🌐 EARTH</span>
            <span id="earthVal" class="val-green" style="font-size: 18px;">--</span>
        </div>
    </div>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('spotPrice').innerText = data.spotPrice;
                document.getElementById('currentDate').innerText = data.currentDate;
                document.getElementById('atmStrike').innerText = data.atmStrike;
                document.getElementById('earthVal').innerText = data.earthVal;
            })
            .catch(err => console.error("Error loading JSON:", err));
    </script>
</body>
</html>
