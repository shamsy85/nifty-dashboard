<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nifty Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nifty 50 Live Tracker</h1>
        <p><strong>Spot Price:</strong> <span id="spot">Loading...</span></p>
        <p><strong>ATM Strike:</strong> <span id="strike">Loading...</span></p>
        <p><strong>Date:</strong> <span id="date">Loading...</span></p>
    </div>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('spot').innerText = data.spotPrice;
                document.getElementById('strike').innerText = data.atmStrike;
                document.getElementById('date').innerText = data.currentDate;
            })
            .catch(error => console.error('Error loading JSON data:', error));
    </script>
</body>
</html>
