<script>
    function updateCardTheme(cardId, tagId, wickId, nodeBodyId, status) {
      const card = document.getElementById(cardId);
      const tag = document.getElementById(tagId);
      const wick = document.getElementById(wickId);
      const nodeBody = document.getElementById(nodeBodyId);

      let color = 'var(--orange)';
      let className = 'neutral';
      let textVal = 'NEUTRAL';

      if (status === 'buyer') {
        color = 'var(--green-bright)';
        className = 'buyer';
        textVal = 'BUYER';
      } else if (status === 'seller') {
        color = 'var(--red-bright)';
        className = 'seller';
        textVal = 'SELLER';
      }

      if (card) card.style.borderColor = color;
      if (tag) {
        tag.className = `status-tag ${className}`;
        tag.innerText = textVal;
      }
      if (wick) wick.style.backgroundColor = color;
      if (nodeBody) nodeBody.style.backgroundColor = color;
    }

    async function loadData() {
      try {
        const res = await fetch('data.json?cache_bust=' + Date.now());
        const data = await res.json();

        const setTxt = (id, val, fallback) => {
          const el = document.getElementById(id);
          if (el) el.innerText = (val !== undefined && val !== null) ? (typeof val === 'number' ? val.toFixed(2) : val) : fallback;
        };

        if (data.spotPrice !== undefined) setTxt('spotPrice', data.spotPrice, '--');
        
        // Fix: Properly update the expiry date badge from JSON payload
        if (data.expiryDate) {
          const expEl = document.getElementById('expiryDate');
          if (expEl) expEl.innerText = 'EXP ' + data.expiryDate;
        }

        if (data.currentDate) document.getElementById('currentDate').innerText = data.currentDate;

        const baseAtm = data.atmStrike || 0;
        if (data.atmStrike !== undefined) {
          const atmEl = document.getElementById('atmStrike');
          if (atmEl) atmEl.innerText = data.atmStrike;
        }

        const ceClose = (data.ce && data.ce.close !== undefined) ? data.ce.close : 0;
        const peClose = (data.pe && data.pe.close !== undefined) ? data.pe.close : 0;
        
        setTxt('bannerTotal', Math.abs(ceClose - peClose), '--');
        setTxt('bannerCe', ceClose, '--');
        setTxt('bannerPe', peClose, '--');

        const ceStrikeEl = document.getElementById('ceStrike');
        if (ceStrikeEl) ceStrikeEl.innerText = baseAtm;
        setTxt('ceHigh', data.ce ? data.ce.high : null, '--');
        setTxt('ceClose', ceClose, '--');
        setTxt('ceLow', data.ce ? data.ce.low : null, '--');
        setTxt('ceHCVal', (data.ce && data.ce.high !== undefined && data.ce.close !== undefined) ? (data.ce.high - ceClose) : null, '--');
        setTxt('ceCLVal', (data.ce && data.ce.close !== undefined && data.ce.low !== undefined) ? (ceClose - data.ce.low) : null, '--');

        const peStrikeEl = document.getElementById('peStrike');
        if (peStrikeEl) peStrikeEl.innerText = baseAtm;
        setTxt('peHigh', data.pe ? data.pe.high : null, '--');
        setTxt('peClose', peClose, '--');
        setTxt('peLow', data.pe ? data.pe.low : null, '--');
        setTxt('peHCVal', (data.pe && data.pe.high !== undefined && data.pe.close !== undefined) ? (data.pe.high - peClose) : null, '--');
        setTxt('peCLVal', (data.pe && data.pe.close !== undefined && data.pe.low !== undefined) ? (peClose - data.pe.low) : null, '--');

        updateCardTheme('ceCard', 'ceStatusTag', 'ceWick', 'ceNode', data.ceStatus || 'neutral');
        updateCardTheme('peCard', 'peStatusTag', 'peWick', 'peBody', data.peStatus || 'neutral');

        setTxt('minSupply', data.minSupply, '--');
        setTxt('minDemand', data.minDemand, '--');
        setTxt('maxSupply', data.maxSupply, '--');
        setTxt('maxDemand', data.maxDemand, '--');

        setTxt('wzSupply1', data.wzSupply1, '--');
        setTxt('wzSupply2', data.wzSupply2, '--');
        setTxt('wzDemand1', data.wzDemand1, '--');
        setTxt('wzDemand2', data.wzDemand2, '--');

        setTxt('mzSupply1', data.mzSupply1, '--');
        setTxt('mzSupply2', data.mzSupply2, '--');
        setTxt('mzDemand1', data.mzDemand1, '--');
        setTxt('mzDemand2', data.mzDemand2, '--');

        if (data.sniper1) {
          const s1Atm = data.sniper1.strike || 0;
          document.getElementById('s1Strike').innerText = s1Atm ? s1Atm : '--';
          setTxt('s1Ce', data.sniper1.ce, '--');
          setTxt('s1Pe', data.sniper1.pe, '--');
          document.getElementById('s1OtmCeStrike').innerText = data.sniper1.otmCeStrike ? data.sniper1.otmCeStrike : '--';
          setTxt('s1OtmCe', data.sniper1.otmCe, '--');
          document.getElementById('s1OtmPeStrike').innerText = data.sniper1.otmPeStrike ? data.sniper1.otmPeStrike : '--';
          setTxt('s1OtmPe', data.sniper1.otmPe, '--');
          setTxt('s1Val', data.sniper1.val, '--');
        }

        if (data.sniper2) {
          const s2Atm = data.sniper2.strike || 0;
          document.getElementById('s2Strike').innerText = s2Atm ? s2Atm : '--';
          setTxt('s2Ce', data.sniper2.ce, '--');
          setTxt('s2Pe', data.sniper2.pe, '--');
          document.getElementById('s2OtmCeStrike').innerText = data.sniper2.otmCeStrike ? data.sniper2.otmCeStrike : '--';
          setTxt('s2OtmCe', data.sniper2.otmCe, '--');
          document.getElementById('s2OtmPeStrike').innerText = data.sniper2.otmPeStrike ? data.sniper2.otmPeStrike : '--';
          setTxt('s2OtmPe', data.sniper2.otmPe, '--');
          setTxt('s2Val', data.sniper2.val, '--');
        }

        setTxt('earthVal', data.earthVal, '--');
      } catch (err) {
        console.warn("Using default baseline parameters.");
        updateCardTheme('ceCard', 'ceStatusTag', 'ceWick', 'ceNode', 'neutral');
        updateCardTheme('peCard', 'peStatusTag', 'peWick', 'peBody', 'neutral');
      }
    }

    loadData();
    setInterval(loadData, 60000); // Auto-poll data every minute
  </script>
