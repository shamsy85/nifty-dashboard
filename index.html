<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty Analytics Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 1px solid #2d2d2d;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }
        .card {
            background: #252525;
            padding: 18px;
            margin-bottom: 16px;
            border-radius: 6px;
            border: 1px solid #333333;
        }
        .card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            color: #ffffff;
        }
        .market-info {
            font-size: 14px;
            margin-bottom: 12px;
            color: #b0b0b0;
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .spot-price strong {
            color: #ffffff;
        }
        .atm-strike {
            font-weight: bold;
            color: #ffffff;
        }
        .sniper-row {
            font-size: 14px;
            margin-bottom: 8px;
            color: #cccccc;
        }
        .sniper-row:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nifty Analytics Dashboard</h1>
        
        <div class="card">
            <h3>Market Overview</h3>
            <div class="market-info">
                Date: <span id="currentDate">-</span> | Expiry: <span id="expiryDate">-</span>
            </div>
            <div class="flex-row">
                <div class="spot-price">Spot Price: <strong id="spotPrice">0.00</strong></div>
                <div class="atm-strike">ATM Strike: <span id="atmStrike">0</span></div>
            </div>
        </div>

        <div class="card">
            <h3>Sniper Setups</h3>
            <div class="sniper-row">
                Sniper 1 Strike: <span id="sniper1-strike">0</span> (Val: <span id="sniper1-val">0</span>)
            </div>
            <div class="sniper-row">
                Sniper 2 Strike: <span id="sniper2-strike">0</span> (Val: <span id="sniper2-val">0</span>)
            </div>
        </div>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                let response = await fetch('data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                let data = await response.json();
                
                document.getElementById('currentDate').innerText = data.currentDate || '-';
                document.getElementById('expiryDate').innerText = data.expiryDate || '-';
                document.getElementById('spotPrice').innerText = data.spotPrice || '0.00';
                document.getElementById('atmStrike').innerText = data.atmStrike || '0';
                
                if (data.sniper1) {
                    document.getElementById('sniper1-strike').innerText = data.sniper1.strike || '0';
                    document.getElementById('sniper1-val').innerText = data.sniper1.val || '0';
                }
                if (data.sniper2) {
                    document.getElementById('sniper2-strike').innerText = data.sniper2.strike || '0';
                    document.getElementById('sniper2-val').innerText = data.sniper2.val || '0';
                }
            } catch (error) {
                console.error('Error fetching data.json:', error);
            }
        }

        loadDashboardData();
        // Auto-refresh every 60 seconds if left open
        setInterval(loadDashboardData, 60000);
    </script>
</body>
</html>
